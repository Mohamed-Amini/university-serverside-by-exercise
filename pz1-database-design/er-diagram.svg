  </text>
  <g class="rel"><title>station.district_id -&gt; district.id</title><polyline points="400,157 370,157 370,128.5 340,128.5" class="link" /><line x1="388" y1="157" x2="400" y2="157" class="foot" /><line x1="388" y1="157" x2="400" y2="151" class="foot" /><line x1="388" y1="157" x2="400" y2="163" class="foot" /><line x1="349" y1="122.5" x2="349" y2="134.5" class="foot" /></g>
