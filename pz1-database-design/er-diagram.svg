<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 830"
     width="1100" height="830" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .bg    { fill: #ffffff; }
    .box   { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
    .head  { fill: #1e3a5f; }
    .divider { stroke: #94a3b8; stroke-width: 1.2; }
    .title { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .subtitle { fill: #cbd5e1; font-size: 11px; text-anchor: end; }
    .col   { fill: #0f172a; font-size: 12px; font-family: Consolas, monospace; }
    .col.key { font-weight: 700; }
    .type  { fill: #64748b; font-size: 10.5px; text-anchor: end; font-family: Consolas, monospace; }
    .badge { fill: #b45309; font-size: 9.5px; font-weight: 700; font-family: Consolas, monospace; }
    .link  { fill: none; stroke: #475569; stroke-width: 1.4; }
    .foot  { stroke: #475569; stroke-width: 1.4; fill: none; }
    .caption { fill: #334155; font-size: 13px; }
    .legend  { fill: #64748b; font-size: 11px; }
  </style>
  <rect width="1100" height="830" class="bg" />
  <text x="40" y="34" class="caption">
